# Publica yacontesto.com en GitHub Pages desde la exportación estática de Next (out/).
# Solo corre con push a main: la rama rediseno no publica nada. Requiere, una vez, en GitHub:
# Settings → Pages → Source: «GitHub Actions» (lo hace Diego).
name: Publicar en Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # La misma puerta que en local: tipos, lint y compilación (con los límites de Suspense resueltos).
      - run: npm run check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
